<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strates</title>
<meta name="description" content="Atlas géologique et autres outils, à ouvrir dans le navigateur.">
<link rel="icon" href="medias/favicon.png">
<style>
/* Une colonne : le programme, puis ses fonctionnalités en vidéo. Polices du système (aucune ressource extérieure). */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --border: rgba(11, 11, 11, 0.10); --accent: #2a78d6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink2: #c3c2b7; --muted: #898781;
    --border: rgba(255, 255, 255, 0.10); --accent: #3987e5; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 48px 20px 56px; display: grid; gap: 36px; }
h1, h2 { margin: 0; line-height: 1.1; text-wrap: balance; }
.site h1 { font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.programme { display: grid; gap: 22px; }
.entete { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.entete img { width: 96px; height: 96px; flex: none; }
.entete div { flex: 1 1 260px; min-width: 0; }
.entete h2 { font-size: clamp(1.9rem, 5vw, 2.6rem); letter-spacing: -0.01em; }
.entete p { margin: 6px 0 0; color: var(--ink2); }
.ouvrir { flex: none; padding: 12px 22px; border-radius: 10px; background: var(--accent); color: #fff;
  text-decoration: none; font-weight: 600; }
.ouvrir:hover { filter: brightness(1.08); }
.ouvrir:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.galerie { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
.galerie figure { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
.galerie .large { grid-column: 1 / -1; }
.galerie video { width: 100%; max-width: 100%; height: auto; display: block; border-radius: 12px;
  border: 1px solid var(--border); background: #fff; }
.galerie figcaption { font-size: .9rem; color: var(--ink2); }
@media (max-width: 640px) { .galerie { grid-template-columns: 1fr; } }

footer { border-top: 1px solid var(--border); padding-top: 16px; color: var(--muted); font-size: .8rem; }
footer p { margin: 0 0 6px; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header class="site"><h1>Strates</h1></header>

  <section class="programme" aria-labelledby="atlas">
    <div class="entete">
      <img src="medias/atlas-icone.png" alt="" width="96" height="96">
      <div>
        <h2 id="atlas">Atlas géologique</h2>
        <p>Roches, minéraux et argiles de France.</p>
      </div>
      <a class="ouvrir" href="atlas/">Ouvrir l'Atlas</a>
    </div>

    <div class="galerie">
      <figure class="large">
        <video src="medias/formation.mp4" poster="medias/formation.jpg" autoplay muted loop playsinline preload="metadata"></video>
        <figcaption>Chaque roche se forme sous vos yeux, étape par étape.</figcaption>
      </figure>
      <figure>
        <video src="medias/argile-eau.mp4" poster="medias/argile-eau.jpg" autoplay muted loop playsinline preload="metadata"></video>
        <figcaption>Une argile qui gonfle en prenant l'eau.</figcaption>
      </figure>
      <figure>
        <video src="medias/quartz.mp4" poster="medias/quartz.jpg" autoplay muted loop playsinline preload="metadata"></video>
        <figcaption>Les cristaux en 3D, atome par atome.</figcaption>
      </figure>
    </div>
  </section>

  <footer>
    <p><a href="https://creativecommons.org/licenses/by-nc/4.0/deed.fr" rel="license">Licence CC BY-NC 4.0</a> —
      réutilisation libre pour l'enseignement, les exposés et les conférences, en citant la source ;
      pas d'utilisation commerciale sans autorisation.</p>
  </footer>
</main>
<script>
  // les vidéos jouent quand elles sont à l'écran ; mouvement réduit demandé : arrêtées, avec les commandes
  var videos = document.querySelectorAll("video");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    videos.forEach(function (v) { v.removeAttribute("autoplay"); v.pause(); v.controls = true; });
  } else if ("IntersectionObserver" in window) {
    var obs = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (e) {
        if (e.isIntersecting) { var p = e.target.play(); if (p && p.catch) p.catch(function () { e.target.controls = true; }); }
        else e.target.pause();
      });
    }, { threshold: 0.25 });
    videos.forEach(function (v) { obs.observe(v); });
  }
</script>
</body>
</html>
