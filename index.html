<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squid</title>
<meta name="description" content="Atlas géologique et autres outils, à ouvrir dans le navigateur.">
<link rel="icon" href="medias/favicon.png">
<style>
/* Une colonne : le programme, puis ses fonctionnalités en vidéo. Polices du système (aucune ressource extérieure). */
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --border: rgba(11, 11, 11, 0.10); --accent: #2a78d6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink2: #c3c2b7; --muted: #898781;
    --border: rgba(255, 255, 255, 0.10); --accent: #3987e5; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 48px 20px 56px; display: grid; gap: 36px; }
h1, h2 { margin: 0; line-height: 1.1; text-wrap: balance; }
.site h1 { font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.programme { display: grid; gap: 22px; }
.entete { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.entete img { width: 96px; height: 96px; flex: none; }
.entete div { flex: 1 1 260px; min-width: 0; }
.entete h2 { font-size: clamp(1.9rem, 5vw, 2.6rem); letter-spacing: -0.01em; }
.entete p { margin: 6px 0 0; color: var(--ink2); }
.ouvrir { flex: none; padding: 12px 22px; border-radius: 10px; background: var(--accent); color: #fff;
  text-decoration: none; font-weight: 600; }
.ouvrir:hover { filter: brightness(1.08); }
.ouvrir:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.defile { width: 100%; max-width: 640px; display: grid; gap: 10px; }
.fenetre { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border); background: #fff; }
.fenetre video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  opacity: 0; transition: opacity .6s ease; }
.fenetre video.actif { opacity: 1; }
.points { display: flex; gap: 8px; justify-content: center; }
.points button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--muted); opacity: .45; }
.points button[aria-current="true"] { background: var(--accent); opacity: 1; }
.points button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .fenetre video { transition: none; } }

footer { border-top: 1px solid var(--border); padding-top: 16px; color: var(--muted); font-size: .8rem; }
footer p { margin: 0 0 6px; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header class="site"><h1>Squid</h1></header>

  <section class="programme" aria-labelledby="atlas">
    <div class="entete">
      <img src="medias/atlas-icone.png" alt="" width="96" height="96">
      <div>
        <h2 id="atlas">Atlas géologique</h2>
        <p>Roches, minéraux et argiles de France.</p>
      </div>
      <a class="ouvrir" href="atlas/">Ouvrir l'Atlas</a>
    </div>

    <div class="defile">
      <div class="fenetre">
        <video src="medias/formation.mp4" poster="medias/formation.jpg" muted playsinline preload="auto" class="actif" aria-label="Formation du granite, étape par étape"></video>
        <video src="medias/argile-eau.mp4" poster="medias/argile-eau.jpg" muted playsinline preload="metadata" aria-label="Une argile qui gonfle en prenant l'eau, en 3D"></video>
        <video src="medias/quartz.mp4" poster="medias/quartz.jpg" muted playsinline preload="metadata" aria-label="Structure du quartz en 3D"></video>
      </div>
      <div class="points" role="group" aria-label="Choisir une animation">
        <button type="button" aria-label="Formation d'une roche" aria-current="true"></button>
        <button type="button" aria-label="Argile et eau, en 3D"></button>
        <button type="button" aria-label="Cristal en 3D"></button>
      </div>
    </div>
  </section>

  <footer>
    <p><a href="https://creativecommons.org/licenses/by-nc/4.0/deed.fr" rel="license">Licence CC BY-NC 4.0</a> —
      réutilisation libre pour l'enseignement, les exposés et les conférences, en citant la source ;
      pas d'utilisation commerciale sans autorisation.</p>
  </footer>
</main>
<script>
  // fenêtre qui défile : chaque vidéo joue jusqu'au bout, puis la suivante ; à l'arrêt hors écran
  (function () {
    var videos = document.querySelectorAll(".fenetre video"), points = document.querySelectorAll(".points button");
    var i = 0, visible = true, calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function jouer() {
      var v = videos[i];
      if (calme || !visible) { v.pause(); return; }
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    }
    function montrer(k) {
      videos[i].pause();
      videos[i].classList.remove("actif"); points[i].removeAttribute("aria-current");
      i = (k + videos.length) % videos.length;
      videos[i].currentTime = 0; videos[i].preload = "auto";
      videos[i].classList.add("actif"); points[i].setAttribute("aria-current", "true");
      jouer();
    }
    videos.forEach(function (v) { v.addEventListener("ended", function () { if (v === videos[i]) montrer(i + 1); }); });
    points.forEach(function (b, k) { b.addEventListener("click", function () { montrer(k); }); });
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (e) { visible = e[0].isIntersecting; jouer(); }, { threshold: 0.25 })
        .observe(document.querySelector(".fenetre"));
    } else jouer();
  })();
</script>
</body>
</html>
