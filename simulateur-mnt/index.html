<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur 3D</title>
<meta name="description" content="Écoulements, dépressions et TWI d'un MNT, en 3D, dans le navigateur : MNT LiDAR HD de l'IGN ou votre propre fichier, qui reste sur votre ordinateur.">
<link rel="icon" href="icone.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=20261107010435">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "geotiff": "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="noyau.js?v=20261107010435"></script>
<script type="module" src="app.js?v=20261107010435"></script>
</head>
<body>
<header class="barre">
  <div class="titre"><img src="icone.png" alt="" width="22" height="22"> Simulateur 3D</div>
  <nav id="onglets" class="onglets" aria-label="Onglets"></nav>
  <button id="b-dessus" class="outil" hidden title="Vue de dessus">▣ Vue de dessus</button>
  <span class="ressort"></span>
  <a class="outil lien" href="notice.html" target="_blank" rel="noopener">Notice</a>
  <label class="outil principal" title="GeoTIFF (.tif) ou grille ASCII (.asc), en Lambert-93 de préférence, dans un nouvel onglet">
    Ouvrir un MNT…<input id="fichier" type="file" accept=".tif,.tiff,.asc" hidden>
  </label>
  <input id="fichier-emprise" type="file" accept=".shp,.prj,.dbf,.shx" multiple hidden>
</header>

<main>
  <section id="centre">
    <div id="carte" class="carte"></div>
    <canvas id="vue3d"></canvas>
    <canvas id="outil-main" class="outil-main"></canvas>
    <div id="legende" class="flottant haut-gauche" hidden></div>
    <div id="lecture" class="flottant bas-gauche" hidden></div>
    <div id="bilan-pluie" class="flottant haut-droite" hidden></div>
    <div id="etiquettes-jauges" class="etiquettes-jauges" hidden></div>
    <div id="bulle" class="bulle" hidden></div>
    <div id="aide" class="aide" hidden>Glisser : tourner · deux doigts ou clic droit : déplacer · pincer : zoomer · double-clic : s'approcher · 0 : vue d'ensemble</div>
    <div id="voile" class="voile" hidden>
      <div class="carte-progres"><progress id="progres" max="1" value="0"></progress><div id="etape"></div>
        <button id="b-arreter" class="outil petit">Arrêter</button></div>
    </div>
    <div id="dialogue" class="voile" hidden><div class="carte-dialogue" id="dialogue-contenu"></div></div>
  </section>
  <aside id="panneau"></aside>
</main>
<div id="zone-depot" class="zone-depot" hidden>Déposer le MNT (.tif, .asc) ou l'emprise (.shp)</div>
</body>
</html>
