<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squid Ferme</title>
<meta name="description" content="Jeu de ferme sur le vrai climat de France depuis 1959 : rendements, énergie et état du sol selon la manière de cultiver.">
<link rel="stylesheet" href="style.css?v=20261108214150">
</head>
<body>
<header class="entete">
  <h1>Squid Ferme</h1>
  <div class="choix">
    <button id="choix-ferme" class="ferme-actuelle" aria-haspopup="true"><span id="ferme-nom"></span> ▾</button>
    <div id="menu-fermes" class="menu-fermes" hidden></div>
  </div>
  <button id="niveau" class="niveau" style="--avance:0">
    <span class="anneau"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="piste" cx="18" cy="18" r="15.5"/><circle class="arc" cx="18" cy="18" r="15.5" pathLength="100"/></svg><span class="niv">1</span></span>
    <span class="exp"><b>0</b> d’exp.</span>
  </button>
  <div id="meteo" class="indic meteo" aria-label="Le jour">
    <b id="date" class="date"></b>
    <span><span id="heure" class="heure" title="Heure de la journée de travail (6 h à 21 h)"><b id="heure-txt"></b></span><canvas id="icone-meteo" width="24" height="24"></canvas><em id="temp"></em><span id="pluie" class="pluie"></span></span>
  </div>
  <div class="frise"><div class="mois"><b id="mois"></b></div><div id="saison" class="saison" role="img"></div></div>
  <div class="indic" aria-label="L’année"><b id="an-jour"></b><span><em id="an-pluie"></em><span>depuis le 1er janvier</span></span></div>
  <div id="vitesses" class="vitesses" role="group" aria-label="Vitesse du temps">
    <button data-vitesse="0" title="Pause (barre d’espace)">❚❚</button>
    <button data-vitesse="1">×1</button>
    <button data-vitesse="3">×3</button>
    <button data-vitesse="10">×10</button>
    <button data-vitesse="30">×30</button>
  </div>
  <span id="argent" class="argent" title="Trésorerie"></span>
</header>

<main class="jeu">
  <section class="champ" id="faillite-zone">
    <div id="defile" class="defile"><canvas id="ecran"></canvas><div id="alertes" class="alertes" aria-hidden="true"></div>
    </div>
    <div id="faillite" class="faillite" hidden><b>Faillite</b><button id="capturer" class="capturer" type="button"></button></div>
    <div id="toast" class="toast" role="status"></div>
    <div id="bandeau" class="bandeau" role="status" hidden></div>
    <div id="bilan" class="bilan" role="status" hidden></div>
    <aside id="volante" class="volante" hidden></aside>
    <div id="decoupe" class="barre-div" hidden><span id="decoupe-t"></span><button id="decoupe-ok" class="recolter" type="button">Valider</button><button id="decoupe-non" class="bt-sec" type="button">Annuler</button></div>
  </section>

  <aside class="panneau">
    <nav id="onglets" class="onglets" role="tablist">
      <button role="tab" data-onglet="objectifs">Objectifs</button>
      <button role="tab" data-onglet="semences">Semences</button>
      <button role="tab" data-onglet="recolte">Récolte</button>
      <button role="tab" data-onglet="parcelles">Parcelles</button>
      <span id="indicateur" class="indicateur" aria-hidden="true"></span>
    </nav>
    <div id="vue" class="vue"></div>
  </aside>
</main>

<div id="installation" class="installation" hidden>
  <div class="install-boite">
    <div class="install-carte">
      <h1 id="install-titre"></h1>
      <svg id="carte-france" role="group" aria-label="Régions agricoles"></svg>
    </div>
    <div class="install-choix">
      <div id="install-region"></div>
      <button id="install-go" class="principal grand"></button>
    </div>
  </div>
</div>

<div id="bulle" class="bulle" hidden></div>
<div id="guide" class="guide" hidden></div>
<canvas id="effets" class="effets"></canvas>

<script src="js/three.min.js"></script>
<script src="donnees/regions.js?v=20261108214150"></script>
<script src="donnees/lieux.js?v=20261108214150"></script>
<script src="js/carte.js?v=20261108214150"></script>
<script src="js/donnees.js?v=20261108214150"></script>
<script src="js/climat.js?v=20261108214150"></script>
<script src="js/agronomie.js?v=20261108214150"></script>
<script src="js/dessin.js?v=20261108214150"></script>
<script src="js/trois.js?v=20261108214150"></script>
<script src="js/plantes.js?v=20261108214150"></script>
<script src="js/decor.js?v=20261108214150"></script>
<script src="js/ciel.js?v=20261108214150"></script>
<script src="js/flotte.js?v=20261108214150"></script>
<script src="js/machines.js?v=20261108214150"></script>
<script src="js/vie.js?v=20261108214150"></script>
<script src="js/rendu.js?v=20261108214150"></script>
<script src="js/animations.js?v=20261108214150"></script>
<script src="js/mecaniques.js?v=20261108214150"></script>
<script src="js/interface.js?v=20261108214150"></script>
<script src="js/jeu.js?v=20261108214150"></script>
</body>
</html>
